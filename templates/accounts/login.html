<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 招标信息采集系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">招</div>
        <div class="login-title">招标信息采集系统</div>
        <div class="login-subtitle">登录后查看招标信息</div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} py-2 mb-3">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="输入任意用户名即可登录" autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">登 录</button>
        </form>
    </div>
</body>
</html>
