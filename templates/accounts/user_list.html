{% extends 'base.html' %}
{% block content %}
<h4 class="mb-3">用户管理</h4>
<table class="table table-striped">
    <thead class="table-dark">
        <tr><th>用户名</th><th>显示名</th><th>角色</th><th>操作</th></tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.username }}</td>
            <td>{{ u.display_name }}</td>
            <td>
                {% if u.is_admin %}<span class="badge bg-danger">管理员</span>
                {% else %}<span class="badge bg-secondary">普通用户</span>{% endif %}
            </td>
            <td>
                {% if u.is_admin %}
                <form method="post" action="{% url 'demote_admin' u.pk %}" style="display:inline" onsubmit="return confirm('确认降级为普通用户？')">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-warning" {% if u == user %}disabled{% endif %}>降级</button>
                </form>
                {% else %}
                <form method="post" action="{% url 'promote_admin' u.pk %}" style="display:inline">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-success">提升为管理员</button>
                </form>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
